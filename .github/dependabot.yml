version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # D-005/D-006/D-008: Dagger artifacts and the Hilt plugin must stay <= 2.59.2.
      # AGP 9.5.1 still bundles Kotlin 2.2.10, while Hilt 2.60+ is built against Kotlin 2.3.21;
      # lift this rule once an AGP release bundles Kotlin >= 2.3.21.
      - dependency-name: "com.google.dagger*"
        versions: ["[2.60,)"]
      # D-006: Freeze Room updates until the caching decision in #17.
      - dependency-name: "androidx.room:*"
      # D-006: AGP major/minor plugin upgrades require a separate toolchain task.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # D-006: Apply the same AGP policy to its Maven artifact; patches stay allowed.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Major upgrades remain individual PRs for easier compatibility review.
    groups:
      androidx-and-material:
        patterns:
          - "androidx.*"
          - "com.google.android.material:*"
        update-types:
          - "minor"
          - "patch"
      square-networking:
        patterns:
          - "com.squareup.*"
        update-types:
          - "minor"
          - "patch"
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        update-types:
          - "minor"
          - "patch"
      coil:
        patterns:
          - "io.coil-kt:*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
